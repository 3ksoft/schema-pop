[package]
name = "schema-pop-rust-nostd"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
# Core
esp-hal = { version = "1.0.0-beta.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "exception-handler"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log"] }
log = { version = "0.4", default-features = false }

# Embassy async runtime
embassy-executor = { version = "0.10.0", features = ["task-arena-size-32768"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"] }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1" }

# WiFi
esp-wifi = { version = "0.15.1", features = ["esp32c3", "wifi", "utils"] }
smoltcp = { version = "0.13.0", default-features = false, features = ["medium-ethernet", "proto-dhcpv4", "socket-tcp"] }

# Static globals
static_cell = { version = "2.1", features = ["nightly"] }
heapless = { version = "0.9.2", default-features = false }

# Schema-pop types (wygenerowane, no_std compatible)
# Brak zależności — wszystko w src/schema.rs

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"