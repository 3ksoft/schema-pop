storage: /verdaccio/storage/data

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Unscoped first-party packages — must NOT proxy to npmjs, otherwise a
  # publish of the same version that's already on real npm gets 409
  # Conflict (verdaccio sees the existing manifest via the upstream).
  'schema-pop':
    access: $all
    publish: $all
    unpublish: $all

  'create-schema-pop':
    access: $all
    publish: $all
    unpublish: $all

  'schema-pop-import':
    access: $all
    publish: $all
    unpublish: $all

  '@schema-pop/*':
    access: $all
    publish: $all
    unpublish: $all

  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

listen: 0.0.0.0:4873

# Logi
log: { type: stdout, format: pretty, level: warn }