<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schema-pop · logo preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="logo.css">
    <style>
        body {
            background: #1a1a1a;
            font-family: 'Inter', sans-serif;
            color: #fdf5e6;
            margin: 0;
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: flex-start;
        }
        button {
            background: #fdf5e6;
            color: #1a1a1a;
            border: 0;
            border-radius: 6px;
            padding: 12px 18px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        button + button { margin-left: 12px; }
        button:hover { background: #fff; }
        .compare {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .compare > div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            opacity: 0.7;
        }
        #svg-host svg, #svg-host img { width: 256px; height: 256px; display: block; }
    </style>
</head>
<body>
    <div class="schema-pop-logo size-512">schema-p<span class="vortex-anchor">o</span>p</div>
    <div class="schema-pop-logo size-256">schema-p<span class="vortex-anchor">o</span>p</div>
    <div class="schema-pop-logo size-128">schema-p<span class="vortex-anchor">o</span>p</div>

    <div class="compare">
        <div>
            <div id="svg-host"></div>
            <span>SVG (no shader)</span>
        </div>
    </div>

    <div>
        <button id="download-png">Download PNG 512×512</button>
        <button id="download-svg">Download SVG</button>
    </div>

    <script src="logo.js"></script>
    <script>
        document.getElementById('svg-host').innerHTML = window.SchemaPopLogo.generateSVG(512);
        document.getElementById('download-png').addEventListener('click', () => {
            window.SchemaPopLogo.downloadSpiral('schema-pop-spiral-512.png', 512);
        });
        document.getElementById('download-svg').addEventListener('click', () => {
            window.SchemaPopLogo.downloadSVG('schema-pop-spiral.svg', 512);
        });
    </script>
</body>
</html>
