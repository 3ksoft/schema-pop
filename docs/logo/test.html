<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schema-pop · logo preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="logo.css">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        .panel {
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            align-items: flex-start;
        }
        .panel.dark { background: #1a1a1a; color: #fdf5e6; color-scheme: dark; }
        .panel.light { background: #fdf5e6; color: #1a1a1a; color-scheme: light; }
        .panel.light .schema-pop-logo { color: #1a1a1a; }
        .row {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .row span {
            font-size: 12px;
            opacity: 0.7;
        }
        .row img { display: block; }
    </style>
</head>
<body>
    <div class="panel dark">
        <div class="schema-pop-logo size-256">schema-p<img class="vortex-anchor" src="schema-pop-spiral.svg" alt="o">p</div>
        <div class="row">
            <img src="schema-pop-spiral.svg" width="160" height="160">
            <span>spiral SVG</span>
        </div>
        <div class="row">
            <img src="schema-pop-wordmark.svg" width="528" height="100">
            <span>wordmark SVG</span>
        </div>
    </div>
    <div class="panel light">
        <div class="schema-pop-logo size-256">schema-p<img class="vortex-anchor" src="schema-pop-spiral.svg" alt="o">p</div>
        <div class="row">
            <img src="schema-pop-spiral.svg" width="160" height="160">
            <span>spiral SVG</span>
        </div>
        <div class="row">
            <img src="schema-pop-wordmark.svg" width="528" height="100">
            <span>wordmark SVG</span>
        </div>
    </div>
</body>
</html>
