name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Avoid two releases racing if tags arrive close together.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to push the version-bump commit back to main
      id-token: write    # for npm provenance (OIDC attestation)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We push a commit back to main, so we need a token that can do that.
          # Default GITHUB_TOKEN is fine since contents:write is granted above.
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node (for npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Bump package versions to tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in packages/core packages/core-exporters packages/extra-exporters packages/create; do
            node -e "
              const fs = require('fs');
              const path = '${pkg}/package.json';
              const pkgJson = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkgJson.version = process.env.VERSION;
              // Pin internal deps to the exact version we're publishing — bun
              // will rewrite workspace:* in the tarball, but pinning here keeps
              // the committed package.json honest.
              for (const key of ['dependencies','devDependencies','peerDependencies']) {
                const deps = pkgJson[key];
                if (!deps) continue;
                for (const name of ['schema-pop','@schema-pop/core-exporters','@schema-pop/extra-exporters']) {
                  if (deps[name] && deps[name] !== 'workspace:*') deps[name] = process.env.VERSION;
                }
              }
              fs.writeFileSync(path, JSON.stringify(pkgJson, null, '\t') + '\n');
            "
          done
          git diff --stat

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests (core)
        run: bun test
        working-directory: packages/core

      # Publish order matters: schema-pop first (no internal deps), then the
      # two exporter packages (depend on schema-pop), then create-schema-pop
      # (transitive dep via scaffolds).
      - name: Publish schema-pop
        run: bun publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        working-directory: packages/core

      - name: Publish @schema-pop/core-exporters
        run: bun publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        working-directory: packages/core-exporters

      - name: Publish @schema-pop/extra-exporters
        run: bun publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        working-directory: packages/extra-exporters

      - name: Publish create-schema-pop
        run: bun publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        working-directory: packages/create

      - name: Commit version bumps to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          # Re-apply the version bump on top of latest main so we don't fight
          # with parallel commits.
          git pull --rebase origin main
          for pkg in packages/core packages/core-exporters packages/extra-exporters packages/create; do
            node -e "
              const fs = require('fs');
              const path = '${pkg}/package.json';
              const pkgJson = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkgJson.version = process.env.VERSION;
              for (const key of ['dependencies','devDependencies','peerDependencies']) {
                const deps = pkgJson[key];
                if (!deps) continue;
                for (const name of ['schema-pop','@schema-pop/core-exporters','@schema-pop/extra-exporters']) {
                  if (deps[name] && deps[name] !== 'workspace:*') deps[name] = process.env.VERSION;
                }
              }
              fs.writeFileSync(path, JSON.stringify(pkgJson, null, '\t') + '\n');
            "
          done
          if ! git diff --quiet; then
            git add packages/*/package.json
            git commit -m "chore(release): v${VERSION}"
            git push origin main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
