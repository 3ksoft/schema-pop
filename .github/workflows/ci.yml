name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same ref so a quick succession of pushes only
# checks the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck (all packages)
        run: bun run typecheck

      - name: Build (core → core-exporters → extra-exporters)
        run: bun run build

      - name: Unit tests (core)
        run: bun test
        working-directory: packages/core

  e2e:
    name: scaffold + ABI consistency (Verdaccio E2E)
    # The full E2E test boots Verdaccio in Docker, scaffolds a fresh project
    # against the local registry, builds Rust/C++/Zig/TS harnesses, and runs
    # the cross-language ABI round-trip. Slow (~3-5 min) so we gate it to
    # main pushes and to PRs that touch publishable packages.
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.labels.*.name), 'e2e')
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install dependencies
        run: bun install

      - name: Run integration test (Docker + Verdaccio)
        run: bun test
        working-directory: packages/create
        timeout-minutes: 15
